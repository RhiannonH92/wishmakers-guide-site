<style id="design-system">
/* ============================================================
   The Wishmaker's Guide — Colors & Type
   ============================================================
   Boutique Disney World planning, by Rhiannon.
   Warm, romantic, magical-but-not-childish, hand-touched.
   ------------------------------------------------------------ */

/* Webfonts — Google Fonts substitutions.
   FLAG: original site fonts not provided; nearest Google matches used.
        Display/body serif: Cormorant Garamond  (elegant italic w/ swashes)
        UI labels:          Jost                (clean geometric, tracks well in CAPS)
   If you have the originals (e.g. Canela / Tenor / GT Sectra),
   drop the .woff2 in /fonts and update the @font-face blocks. */
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap");

:root {
  /* ─── COLOR — Core palette ───────────────────────────────── */
  /* Deep aubergine plum — footer, full-service card, headlines on cream */
  --plum-900: #2B1B2A;
  --plum-800: #3A2438;
  --plum-700: #4A2E47;
  --plum-600: #5C3A58;

  /* Warm body ink — softened plum, never pure black */
  --ink-900: #2B1B2A;
  --ink-700: #4A3A48;
  --ink-500: #6E5E6B;
  --ink-400: #8A7C87;

  /* Cream / champagne — page backgrounds, cards on dark */
  --cream-50:  #FBF6EE;
  --cream-100: #F4EBDB;   /* primary section bg */
  --cream-200: #EADFC9;   /* card surface on cream */
  --cream-300: #DCCEB4;   /* dividers / outlines on cream */

  /* Gold / champagne — accents, italic display words, primary CTA */
  --gold-100: #E8D7B2;
  --gold-300: #CDB078;
  --gold-500: #B8915E;    /* canonical gold */
  --gold-600: #A0784A;
  --gold-700: #7E5B33;

  /* Blush — badge, soft highlights, hand-stamped marks */
  --blush-100: #F6E3DC;
  --blush-200: #EFCFC4;
  --blush-300: #E2B2A4;
  --blush-500: #C68676;

  /* Pastel mist — secondary surfaces, hover wash */
  --mist-100:  #E9E3DE;
  --mist-200:  #D6CDC4;

  /* Pure */
  --white: #FFFFFF;
  --paper: #FFFDF9;

  /* ─── COLOR — Semantic roles ─────────────────────────────── */
  --bg-page:          var(--cream-100);
  --bg-elevated:      var(--cream-50);
  --bg-inverse:       var(--plum-900);
  --bg-card:          var(--cream-50);
  --bg-card-feature:  var(--plum-800);  /* the "Full Concierge" treatment */
  --bg-soft:          var(--blush-100);

  --fg-strong:        var(--plum-900);  /* display headings */
  --fg-body:          var(--ink-700);   /* primary body */
  --fg-muted:         var(--ink-500);   /* meta, captions */
  --fg-quiet:         var(--ink-400);   /* dividers between meta */
  --fg-accent:        var(--gold-500);  /* italic emphasis word */
  --fg-on-dark:       var(--cream-100);
  --fg-on-dark-muted: #BFAEBC;
  --fg-on-dark-accent:var(--gold-300);

  --border-soft:      var(--cream-300);
  --border-strong:    var(--ink-400);
  --border-on-dark:   rgba(232, 215, 178, 0.18);

  --action-primary-bg:    var(--gold-500);
  --action-primary-bg-hv: var(--gold-600);
  --action-primary-fg:    var(--cream-50);
  --action-ghost-fg:      var(--plum-900);
  --action-ghost-fg-on-dark: var(--gold-300);

  /* ─── TYPE — Families ────────────────────────────────────── */
  --font-display: "Cormorant Garamond", "Tenor Sans", Garamond, "EB Garamond", serif;
  --font-body:    "Cormorant Garamond", Garamond, "EB Garamond", Georgia, serif;
  --font-ui:      "Jost", "HK Grotesk", "Söhne", -apple-system, "Helvetica Neue", sans-serif;

  /* ─── TYPE — Scale (display is generous; body is calm) ──── */
  --t-display-xl: 72px;  /* hero — "The holiday of a lifetime..." */
  --t-display-l:  56px;  /* section headlines — "Questions, answered." */
  --t-display-m:  40px;  /* sub-section headlines */
  --t-display-s:  28px;  /* card headlines — "40-minute Zoom" */
  --t-body-xl:    26px;  /* pull-quote */
  --t-body-l:     19px;  /* lead paragraph */
  --t-body:       17px;  /* default body */
  --t-body-s:     15px;  /* secondary body */
  --t-meta:       13px;  /* captions, stat labels */
  --t-eyebrow:    12px;  /* tracked uppercase eyebrows */
  --t-micro:      11px;  /* footer fine print */

  /* ─── TYPE — Weights & treatments ───────────────────────── */
  --w-display: 500;
  --w-body:    400;
  --w-ui:      400;
  --w-ui-strong: 500;

  --lh-display: 1.1;
  --lh-headline: 1.18;
  --lh-body: 1.6;
  --lh-tight: 1.3;

  --tracking-eyebrow: 0.22em;
  --tracking-button:  0.18em;
  --tracking-label:   0.14em;

  /* ─── SPACING ────────────────────────────────────────────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;

  /* ─── RADII ──────────────────────────────────────────────── */
  /* Crisp, gentle — barely-there rounding. Never pill-y. */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-pill: 999px;     /* used sparingly — badges only */

  /* ─── ELEVATION ──────────────────────────────────────────── */
  /* Shadows are soft and warm — never harsh greys. */
  --shadow-1: 0 1px 2px rgba(43, 27, 42, 0.06);
  --shadow-2: 0 4px 14px rgba(43, 27, 42, 0.08);
  --shadow-3: 0 12px 32px rgba(43, 27, 42, 0.12);
  --shadow-warm: 0 18px 40px -16px rgba(126, 91, 51, 0.28);

  /* ─── MOTION ─────────────────────────────────────────────── */
  --ease-soft:  cubic-bezier(.22, .61, .36, 1);
  --ease-glide: cubic-bezier(.4, 0, .2, 1);
  --dur-1: 120ms;
  --dur-2: 220ms;
  --dur-3: 420ms;
  --dur-slow: 700ms;
}

/* ============================================================
   Semantic typography — apply directly or extend
   ------------------------------------------------------------ */

html { color: var(--fg-body); background: var(--bg-page); }
body { font-family: var(--font-body); font-size: var(--t-body); line-height: var(--lh-body); }

/* Italic gold accent — the brand's signature gesture.
   Used inside any heading: <h1>The holiday of a <em>lifetime</em>.</h1> */
.display em, .display i, h1 em, h2 em, h3 em, .accent {
  font-style: italic;
  color: var(--fg-accent);
  font-weight: inherit;
}

h1, .h1, .display-xl {
  font-family: var(--font-display);
  font-weight: var(--w-display);
  font-size: var(--t-display-xl);
  line-height: var(--lh-display);
  letter-spacing: -0.005em;
  color: var(--fg-strong);
  margin: 0;
}

h2, .h2, .display-l {
  font-family: var(--font-display);
  font-weight: var(--w-display);
  font-size: var(--t-display-l);
  line-height: var(--lh-headline);
  color: var(--fg-strong);
  margin: 0;
}

h3, .h3, .display-m {
  font-family: var(--font-display);
  font-weight: var(--w-display);
  font-size: var(--t-display-m);
  line-height: var(--lh-headline);
  color: var(--fg-strong);
  margin: 0;
}

h4, .h4, .card-title {
  font-family: var(--font-display);
  font-weight: var(--w-display);
  font-size: var(--t-display-s);
  line-height: var(--lh-tight);
  color: var(--fg-strong);
  margin: 0;
}

p, .body { margin: 0; }
.lead { font-size: var(--t-body-l); line-height: var(--lh-body); color: var(--fg-body); }
.body-s { font-size: var(--t-body-s); line-height: 1.55; color: var(--fg-body); }
.meta  { font-size: var(--t-meta);  line-height: 1.5; color: var(--fg-muted); }

.pullquote {
  font-family: var(--font-display);
  font-size: var(--t-body-xl);
  line-height: 1.35;
  color: var(--fg-strong);
}

/* Tracked uppercase eyebrow — "— A NOTE FROM THE PLANNER —" */
.eyebrow {
  font-family: var(--font-ui);
  font-size: var(--t-eyebrow);
  font-weight: var(--w-ui-strong);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  color: var(--fg-accent);
}

.label {
  font-family: var(--font-ui);
  font-size: var(--t-eyebrow);
  font-weight: var(--w-ui-strong);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--fg-muted);
}

.button-label {
  font-family: var(--font-ui);
  font-weight: var(--w-ui-strong);
  text-transform: uppercase;
  letter-spacing: var(--tracking-button);
  font-size: var(--t-eyebrow);
}

<style>
/* ============================================================
   The Wishmaker's Guide — site styles
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream-100);
  color: var(--fg-body);
  font-family: var(--font-body);
  font-size: var(--t-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button { font: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* Layout */
.container { max-width: 1180px; margin: 0 auto; padding-left: 40px; padding-right: 40px; }
.section { padding: var(--space-9) 0; }
.section--tight { padding: var(--space-7) 0; }
.section--soft { background: var(--cream-50); }
.section--plum { background: var(--plum-900); color: var(--cream-100); }

/* Tweak: Plum-led variant darkens softer sections */
body[data-mood="plum"] .section--soft { background: var(--cream-50); }
body[data-mood="plum"] {
  background: var(--cream-50);
}

/* Eyebrow */
.eyebrow-ornament {
  display: inline-flex; align-items: center; gap: 14px;
  color: var(--gold-500);
  font-family: var(--font-ui);
  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 500;
}
.eyebrow-ornament .rule { width: 32px; height: 1px; background: currentColor; opacity: 0.45; }
.eyebrow-ornament .star { font-size: 13px; line-height: 1; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 24px;
  font-family: var(--font-ui); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.18em;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: none; color: inherit; text-align: left;
  transition: background var(--dur-2) var(--ease-soft), border-color var(--dur-2) var(--ease-soft), color var(--dur-2) var(--ease-soft);
  text-decoration: none;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn .chev { font-size: 14px; line-height: 1; transition: transform var(--dur-2) var(--ease-soft); }
.btn:hover:not(:disabled) .chev { transform: translateX(3px); }
.btn--primary { background: var(--gold-500); color: var(--cream-50); }
.btn--primary:hover:not(:disabled) { background: var(--gold-600); }
.btn--ghost { border-color: var(--cream-300); color: var(--plum-900); }
.btn--ghost:hover:not(:disabled) { border-color: var(--ink-400); }
.btn--ghost-dark { border-color: rgba(232, 215, 178, 0.35); color: var(--gold-300); }
.btn--ghost-dark:hover:not(:disabled) { border-color: var(--gold-300); }
.btn--soft-pill { background: var(--gold-500); color: var(--cream-50); padding: 16px 32px; }
.btn--soft-pill:hover:not(:disabled) { background: var(--gold-600); }

/* Cards */
.card-base {
  background: var(--cream-50);
  border: 1px solid var(--cream-300);
  border-radius: var(--radius-md);
  transition: transform var(--dur-2) var(--ease-soft), box-shadow var(--dur-2) var(--ease-soft);
}
.card-base:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }

/* Form fields */
.field { display: flex; flex-direction: column; gap: 10px; }
.field > label {
  font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-500); font-weight: 500;
}
.field input, .field textarea {
  font-family: var(--font-body); font-size: 17px; color: var(--plum-900);
  background: transparent;
  border: 0; border-bottom: 1px solid var(--ink-400);
  border-radius: 0;
  padding: 8px 0 10px;
  outline: none; width: 100%;
  transition: border-color var(--dur-2);
}
.field input::placeholder, .field textarea::placeholder { color: var(--ink-400); font-style: italic; }
.field input:focus, .field textarea:focus { border-bottom-color: var(--gold-500); }
.field textarea { resize: vertical; min-height: 80px; }

/* Form fields — on dark lead-magnet bg */
.field--dark > label { color: rgba(244, 235, 219, 0.55); }
.field--dark input {
  color: var(--cream-100);
  border-bottom-color: rgba(232, 215, 178, 0.3);
}
.field--dark input::placeholder { color: rgba(244, 235, 219, 0.35); }
.field--dark input:focus { border-bottom-color: var(--gold-300); }

/* Sparkles */
.sparkle {
  position: absolute; color: var(--cream-100); opacity: 0.85;
  pointer-events: none;
  animation: sparklePulse 3.2s ease-in-out infinite;
}
.sparkle svg { width: 100%; height: 100%; fill: currentColor; }
@keyframes sparklePulse {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50%      { opacity: 1;   transform: scale(1); }
}

/* Hero (photo variant) */
.hero-eyebrow {
  font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold-300); font-weight: 500;
}
.hero-display {
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(56px, 7.2vw, 92px); line-height: 1.02;
  color: var(--cream-100);
  letter-spacing: -0.005em;
  text-shadow: 0 1px 24px rgba(43, 27, 42, 0.25);
}
.hero-aside {
  position: absolute; right: 40px; bottom: 144px;
  max-width: 360px; color: var(--cream-100);
}
.hero-scroll {
  position: absolute; left: 40px; bottom: 32px;
  font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.28em;
  text-transform: uppercase; color: rgba(244, 235, 219, 0.8); font-weight: 500;
}

/* Services */
.services-grid { display: grid; gap: 18px; margin-top: 56px; }
.services-grid--top { grid-template-columns: repeat(3, 1fr); }
.services-grid--bottom { grid-template-columns: 1fr 1fr; margin-top: 18px; }

/* Benefits */
.benefits-grid {
  margin-top: 64px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
  text-align: left;
}

/* About */
.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 420px) 1fr;
  gap: 80px; align-items: start;
}

/* Contact */
.contact-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start;
}

/* Lead-magnet grid */
.lead-grid { gap: 80px; }

/* Gallery */
.gallery-section { background: var(--cream-50); }
.gallery-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 36px;
  margin-top: 56px;
}
.gallery-figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
/* Subtle scrapbook tilts — each photo a touch different */
.gallery-figure:nth-child(1) { transform: rotate(-1.2deg); }
.gallery-figure:nth-child(2) { transform: rotate(0.6deg); margin-top: 18px; }
.gallery-figure:nth-child(3) { transform: rotate(-0.5deg); }
.gallery-frame {
  background: var(--cream-50);
  border: 1px solid var(--cream-300);
  padding: 10px;
  box-shadow: var(--shadow-2);
  width: 100%;
  aspect-ratio: 3/4;
  overflow: hidden;
  transition: transform var(--dur-3) var(--ease-soft), box-shadow var(--dur-3) var(--ease-soft);
}
.gallery-figure:hover .gallery-frame {
  transform: translateY(-3px);
  box-shadow: var(--shadow-3);
}
.gallery-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  background: var(--cream-200);
  /* Style alt text when image fails to load (until user adds photos) */
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-500);
  text-align: center;
}
.contact-photo img { background: var(--cream-200); }
.gallery-figure figcaption {
  margin-top: 18px;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 17px;
  color: var(--gold-600);
}

/* Contact photo (small, single, above the dl) */
.contact-photo {
  width: 200px;
  aspect-ratio: 4/5;
  margin: 32px 0 0;
  background: var(--cream-50);
  border: 1px solid var(--cream-300);
  padding: 8px;
  box-shadow: var(--shadow-2);
  transform: rotate(-1.5deg);
}
.contact-photo img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

/* Footer */
.footer-grid {
  display: grid; grid-template-columns: 1.6fr 1fr 1.3fr 1fr; gap: 48px;
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 1100px) {
  .container { padding-left: 32px; padding-right: 32px; }
  .services-grid--top { grid-template-columns: repeat(2, 1fr); }
  .services-grid--bottom { grid-template-columns: 1fr 1fr; }
  .benefits-grid { grid-template-columns: repeat(2, 1fr); gap: 40px 32px; }
}
@media (max-width: 880px) {
  /* The React component sets `style={{ display: "flex" }}` inline, which
     beats normal CSS specificity. !important is required to override it. */
  .nav-links { display: none !important; }
  .section { padding: var(--space-8) 0; }
  .about-grid, .contact-grid, .lead-grid { grid-template-columns: 1fr; gap: 48px; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
  .services-grid--top, .services-grid--bottom { grid-template-columns: 1fr; }
  .hero-aside { position: static; max-width: none; margin-top: 36px; }
  .hero-scroll { display: none; }
  /* Gallery → smaller gap at tablet width */
  .gallery-grid { gap: 28px; }
}
@media (max-width: 560px) {
  .container { padding-left: 24px; padding-right: 24px; }
  .footer-grid { grid-template-columns: 1fr; }
  .benefits-grid { grid-template-columns: 1fr; }
}

/* ============================================================
   Mobile overrides — desktop layout unchanged above ~720px
   ------------------------------------------------------------
   The page uses heavy inline style={{ }} on React components,
   so the only reliable way to override layout/sizing on small
   screens without rewriting the components is to use !important
   inside scoped media queries. Specificity here is intentional.
   ============================================================ */
@media (max-width: 720px) {

  /* -------- Containers & sections -------- */
  .container { padding-left: 20px !important; padding-right: 20px !important; }
  .section { padding: 56px 0 !important; }

  /* -------- Universal heading scale-down -------- */
  /* The h2 = 54px set inline on every section is the single biggest
     mobile problem. Knock it down hard. */
  section h2 { font-size: 38px !important; line-height: 1.1 !important; }

  /* -------- Nav -------- */
  header { padding: 14px 20px !important; }
  header > a[href="#contact"] {
    padding: 8px 14px !important;
    font-size: 9px !important;
    letter-spacing: 0.18em !important;
  }

  /* -------- Hero (photo variant) -------- */
  #top { min-height: auto !important; padding-top: 64px !important; }
  /* Inner container override — the hero uses paddingTop: 200, paddingBottom: 120 */
  #top > .container { padding-top: 110px !important; padding-bottom: 70px !important; }
  .hero-display { font-size: 56px !important; }
  /* Hero aside is "position: static" below 880, so just tighten spacing */
  .hero-aside { margin-top: 28px !important; }
  .hero-aside p { font-size: 16px !important; }
  /* Hero type variant */
  #top h1 { font-size: 54px !important; }

  /* -------- Eyebrow ornament -------- */
  .eyebrow-ornament { font-size: 10px !important; letter-spacing: 0.2em !important; gap: 10px !important; }
  .eyebrow-ornament .rule { width: 20px !important; }

  /* -------- Buttons -------- */
  .btn { padding: 12px 18px !important; font-size: 10px !important; letter-spacing: 0.16em !important; }
  .btn--soft-pill { padding: 14px 22px !important; }

  /* -------- Services intro lead -------- */
  #services .container > p,
  #why-me .container > p,
  #faqs .container > p { font-size: 15px !important; }

  /* -------- Service cards -------- */
  .service-card { padding: 22px 20px !important; min-height: 0 !important; }
  .service-card h4 { font-size: 26px !important; }
  .service-card p { font-size: 14.5px !important; }

  /* -------- Benefits grid -------- */
  .benefits-grid { margin-top: 40px !important; gap: 32px !important; }
  .benefits-grid h4 { font-size: 22px !important; }

  /* -------- About -------- */
  .about-grid { gap: 32px !important; }
  #about .about-grid > div:first-child { padding-top: 0 !important; padding-left: 0 !important; }
  #about .about-grid > div:last-child > div p { font-size: 16px !important; }

  /* -------- Lead magnet -------- */
  #guide { padding: 72px 0 !important; }
  #guide > .container > div { gap: 56px !important; }
  /* Bullet list — force single column */
  #guide ul { grid-template-columns: 1fr !important; max-width: none !important; gap: 12px !important; }
  /* The decorative PDF tile is absolutely positioned at top:-36 right:-8 width:220 height:280
     and overlaps the form badly on narrow screens. Shrink and reposition. */
  #guide form { padding: 28px 22px 24px !important; }
  #guide [style*="rotate(4deg)"] {
    width: 150px !important;
    height: 190px !important;
    top: -28px !important;
    right: -4px !important;
    padding: 16px !important;
  }
  #guide [style*="rotate(4deg)"] h4 { font-size: 16px !important; }
  #guide [style*="rotate(4deg)"] span { font-size: 9px !important; }
  /* Lead magnet form button */
  #guide form button.btn { padding: 14px 18px !important; }

  /* -------- FAQ -------- */
  #faqs .container > div { margin-top: 40px !important; }
  /* FAQ question button — tighten right padding so + sign isn't squished */
  #faqs button > span:first-child { font-size: 15.5px !important; padding-right: 16px !important; }
  /* FAQ answer — kill the 60px right padding */
  #faqs [style*="paddingRight: 60"],
  #faqs div[style*="padding-right: 60"] { padding-right: 0 !important; font-size: 15px !important; }
  /* Cover both — answers via the open panel */
  #faqs > div div > div[style*="paddingBottom"] { padding-right: 0 !important; }

  /* -------- Gallery -------- */
  .gallery-grid {
    grid-template-columns: 1fr !important;
    gap: 32px !important;
    margin-top: 36px !important;
    max-width: 320px;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  /* Remove tilts on mobile — they look awkward in a single column */
  .gallery-figure { transform: none !important; margin-top: 0 !important; }
  .gallery-figure figcaption { font-size: 16px !important; margin-top: 14px !important; }
  /* Gallery section heading */
  .gallery-section h3 { font-size: 30px !important; }

  /* -------- Contact -------- */
  .contact-grid { gap: 40px !important; }
  /* Contact form padding */
  #contact form { padding: 28px 22px 26px !important; gap: 20px !important; }
  /* The "Drop me a line" cursive label crashes into the form on small widths */
  #contact form > span[style*="absolute"] { display: none !important; }
  /* Contact dl — let value column wrap */
  #contact dl { margin-top: 32px !important; column-gap: 20px !important; }

  /* -------- Footer -------- */
  footer { padding-top: 56px !important; padding-bottom: 24px !important; }
  .footer-grid { gap: 36px !important; }
  /* Bottom copyright row — stack vertically on mobile, no awkward 3-up wrap */
  footer > .container > div:last-child {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
    text-align: left !important;
  }
}

/* Very small phones (≤380px) — squeeze a bit more */
@media (max-width: 380px) {
  .container { padding-left: 16px !important; padding-right: 16px !important; }
  section h2 { font-size: 34px !important; }
  .hero-display { font-size: 48px !important; }
  #top h1 { font-size: 46px !important; }
  /* Hide the secondary "Get in touch" button at very narrow widths — logo only */
  header > a[href="#contact"] { display: none !important; }
}

/* ============================================================
   Body text size bump — desktop AND mobile
   ------------------------------------------------------------
   The site uses Cormorant Garamond as the body face, a display
   serif with a small x-height that reads smaller than its
   nominal px size suggests. Bumping body copy 17→19, 19→21,
   15/14.5→16. Headings, eyebrows, prices and meta untouched.
   Attribute selectors target inline style="" because the
   components inline their typography. Both spaced and
   unspaced forms covered ("font-size: 17px" / "font-size:17px")
   since React's exact rendering varies.
   ============================================================ */

/* Body copy at 17px — bump to 19px. The --font-body filter avoids
   accidentally bumping display-font headings that happen to be 17px. */
[style*="font-family:var(--font-body)"][style*="font-size:17px"],
[style*="font-family: var(--font-body)"][style*="font-size: 17px"],
[style*="font-family:var(--font-body)"][style*="font-size: 17px"],
[style*="font-family: var(--font-body)"][style*="font-size:17px"] {
  font-size: 19px !important;
}

/* Lead paragraph at 19px (typography hero variant) — bump to 21px */
[style*="font-family:var(--font-body)"][style*="font-size:19px"],
[style*="font-family: var(--font-body)"][style*="font-size: 19px"],
[style*="font-family:var(--font-body)"][style*="font-size: 19px"],
[style*="font-family: var(--font-body)"][style*="font-size:19px"] {
  font-size: 21px !important;
}

/* Card / secondary body — 15px → 16.5px */
[style*="font-family:var(--font-body)"][style*="font-size:15px"],
[style*="font-family: var(--font-body)"][style*="font-size: 15px"],
[style*="font-family:var(--font-body)"][style*="font-size: 15px"],
[style*="font-family: var(--font-body)"][style*="font-size:15px"] {
  font-size: 16.5px !important;
}

/* 14.5px → 16px */
[style*="font-family:var(--font-body)"][style*="font-size:14.5px"],
[style*="font-family: var(--font-body)"][style*="font-size: 14.5px"],
[style*="font-family:var(--font-body)"][style*="font-size: 14.5px"],
[style*="font-family: var(--font-body)"][style*="font-size:14.5px"] {
  font-size: 16px !important;
}

/* FAQ question (17px, body font) — covered by the 17px rule above */
/* FAQ answer (15.5px) — bump to 17px */
[style*="font-family:var(--font-body)"][style*="font-size:15.5px"],
[style*="font-family: var(--font-body)"][style*="font-size: 15.5px"] {
  font-size: 17px !important;
}

/* Contact dl values (15px) — covered by the 15px rule above */
/* Lead-magnet bullets and footer copy — covered above */

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

   Every component is attached to window so the babel-transpiled scripts share scope. */

/* ============================================================
   ATOMS
   ============================================================ */

  const color = tone === "light" ? "var(--gold-300)" : "var(--gold-500)";
  return (
    <span className="eyebrow-ornament" style={{ color }}>
      <span className="rule"></span>
      {withStars && <span className="star">✦</span>}
      <span>{children}</span>
      {withStars && <span className="star">✦</span>}
      <span className="rule"></span>
    </span>
  );
}

function Gold({ children }) {
  return <em style={{ fontStyle: "italic", color: "var(--gold-500)", fontWeight: "inherit" }}>{children}</em>;
}
function GoldLight({ children }) {

function Button({ children, variant = "primary", arrow = true, as = "button", href, ...rest }) {

    ghost: "btn btn--ghost",
    "ghost-dark": "btn btn--ghost-dark",

              {g.items.map((it, ii) => {
                const key = `${gi}-${ii}`;
                return (
                  <FAQItem key={key} item={it}
                           open={openKey === key}
                           onToggle={() => setOpenKey(openKey === key ? null : key)} />
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

Object.assign(window, { FAQ });


/* ============================================================
   CONTACT — Formspree-wired
   FORMSPREE: replace CONTACT_FORMSPREE_ID with your endpoint
   ============================================================ */

function Contact() {
  const [sent, setSent] = React.useState(false);
  const [pending, setPending] = React.useState(false);
  const [form, setForm] = React.useState({ name: "", email: "", note: "" });
  const formspreeId = window.FORMSPREE_CONTACT_ID;

  const onSubmit = async (e) => {
    e.preventDefault();
    setPending(true);
    try {
      if (formspreeId && !formspreeId.startsWith("REPLACE")) {
        const res = await fetch(`https://formspree.io/f/${formspreeId}`, {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify(form),
        });
        if (!res.ok) throw new Error("submit failed");
      }
      setSent(true);
      setForm({ name: "", email: "", note: "" });
      setTimeout(() => setSent(false), 5000);
    } catch (err) {
      setSent(true);
      setTimeout(() => setSent(false), 5000);
    } finally {
      setPending(false);
    }
  };

  return (
    <section id="contact" className="section">
      <div className="container">
        <div className="contact-grid">
          <div>
            <span style={{
              fontFamily: "var(--font-ui)", fontSize: 11, fontWeight: 500,
              letterSpacing: "0.24em", textTransform: "uppercase",
              color: "var(--ink-500)",
            }}>— Contact</span>
            <h2 style={{
              fontFamily: "var(--font-display)", fontSize: 54, fontWeight: 500,
              color: "var(--plum-900)", margin: "16px 0 24px", lineHeight: 1.1,
            }}>
              Get in <Gold>Touch</Gold>
            </h2>
            <p style={{
              fontFamily: "var(--font-body)", fontStyle: "italic",
              fontSize: 17, color: "var(--ink-500)", maxWidth: 40 + "ch", margin: 0,
              lineHeight: 1.6,
            }}>
              Have questions or ready to start planning your dream Disney trip?
              I'd love to hear from you!
            </p>

            {/* PHOTO PLACEHOLDER — Contact section
                Replace ./photos/trip-4.jpg with your photo.
                Recommended: a warm, personal shot (a quiet park moment,
                a smiling photo with characters, golden hour at the castle).
                4:5 portrait crop works best. */}
            <figure className="contact-photo">
              <img src="./photos/trip-4.jpg"
                   alt="REPLACE: describe the photo for screen readers" />
            </figure>

            <dl style={{
              marginTop: 48, display: "grid",
              gridTemplateColumns: "auto 1fr", rowGap: 16, columnGap: 32,
              fontFamily: "var(--font-body)", fontSize: 15,
            }}>
              {[
                ["Reply",     <>Usually within <Gold>48 hours</Gold></>],
                ["Email",     <a href="mailto:hello@thewishmakersguide.co.uk" style={{ color: "var(--ink-700)", borderBottom: "1px solid var(--cream-300)" }}>hello@thewishmakersguide.co.uk</a>],
                ["Based",     <>United Kingdom, <em style={{ fontStyle: "italic", color: "var(--gold-600)" }}>working in your timezone</em></>],
              ].map(([k, v], i) => (
                <React.Fragment key={i}>
                  <dt style={{
                    fontFamily: "var(--font-ui)", fontSize: 10, letterSpacing: "0.22em",
                    textTransform: "uppercase", color: "var(--ink-500)", fontWeight: 500,
                    paddingTop: 3,
                  }}>{k}</dt>
                  <dd style={{ margin: 0, color: "var(--ink-700)" }}>{v}</dd>
                </React.Fragment>
              ))}
            </dl>
          </div>

          <form onSubmit={onSubmit} style={{
            background: "var(--cream-50)",
            border: "1px solid var(--cream-300)",
            borderRadius: "var(--radius-md)",
            padding: "40px 40px 36px",
            display: "flex", flexDirection: "column", gap: 24,
            position: "relative",
            boxShadow: "var(--shadow-1)",
          }}>
            <span style={{
              position: "absolute", top: 14, right: 20,
              fontFamily: "var(--font-display)", fontStyle: "italic",
              fontSize: 13, color: "var(--gold-600)", opacity: 0.7,
            }}>› Drop me a line ‹</span>

            <div className="field">
              <label>Your name</label>
              <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })}
                     placeholder="eg. Emma Wishart" required/>
            </div>
            <div className="field">
              <label>Email address</label>
              <input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })}
                     placeholder="emma@email.com" required/>
            </div>
            <div className="field">
              <label>Tell me about your trip</label>
              <textarea value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })}
                        placeholder="When you're going, who you're hoping to travel with, and what you'd like help with…"
                        rows="4"/>
            </div>

            <div style={{ display: "flex", justifyContent: "space-between",
                          alignItems: "center", marginTop: 4, gap: 16, flexWrap: "wrap" }}>
              <span style={{ fontFamily: "var(--font-body)", fontStyle: "italic",
                            fontSize: 13, color: "var(--ink-500)" }}>
                No obligation — just a friendly chat.
              </span>
              <button type="submit" className="btn btn--primary" disabled={pending}>
                <span>{pending ? "Sending…" : "Send message"}</span>
                <span className="chev">›</span>
              </button>
            </div>

            {sent && (
              <div style={{
                position: "absolute", inset: "auto 16px 16px 16px",
                background: "var(--cream-50)", border: "1px solid var(--gold-300)",
                borderRadius: "var(--radius-md)", padding: "14px 18px",
                fontFamily: "var(--font-body)", fontStyle: "italic", fontSize: 14,
                color: "var(--plum-900)", boxShadow: "var(--shadow-warm)",
                display: "flex", alignItems: "center", gap: 10,
              }}>
                <SparkleStar size={12} color="var(--gold-500)"/>
                Lovely — message sent. I'll reply within 48 hours.
              </div>
            )}
          </form>
        </div>
      </div>
    </section>
  );
}

Object.assign(window, { Contact });

</script>

<!-- App + Tweaks -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "hero": "photo",
  "services": "grid",
  "mood": "cream"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply mood to body
  React.useEffect(() => {
    document.body.dataset.mood = t.mood;
  }, [t.mood]);

  const heroIsLight = t.hero === "type" || t.hero === "split";

  return (
    <React.Fragment>
      <Nav heroIsLight={heroIsLight} />
      <main>
        <Hero variant={t.hero} />
        <PlannerNote />
        <Services layout={t.services} />
        <WhyPlanner />
        <Gallery />
        <LeadMagnet />
        <About />
        <FAQ />
        <Contact />
      </main>
      <Footer />

      <TweaksPanel>
        <TweakSection label="Hero" />
        <TweakRadio label="Style" value={t.hero}
                    options={[
                      { value: "photo", label: "Photo" },
                      { value: "type",  label: "Type" },
                      { value: "split", label: "Split" },
                    ]}
                    onChange={(v) => setTweak("hero", v)} />

        <TweakSection label="Services" />
        <TweakRadio label="Layout" value={t.services}
                    options={[
                      { value: "grid", label: "Grid" },
                      { value: "list", label: "List" },
                    ]}
                    onChange={(v) => setTweak("services", v)} />

        <TweakSection label="Mood" />
        <TweakRadio label="Palette" value={t.mood}
                    options={[
                      { value: "cream", label: "Cream" },
                      { value: "plum",  label: "Plum" },
                    ]}
                    onChange={(v) => setTweak("mood", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
